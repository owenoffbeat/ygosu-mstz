name: crawl
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: crawl
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/cloud-crawl.mjs
      - run: node tools/post-html.mjs        # data/rankings.json → docs/rankings.json + docs/index.html 재생성
      - name: Commit and push
        run: |
          git config user.name "ygosu-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/ tools/
          git diff --cached --quiet || git commit -m "crawl: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || {
            echo "push failed — syncing with remote and retrying"
            git pull --rebase -X theirs || true
            git push
          }
