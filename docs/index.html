<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스대게 활동 랭킹</title>
<style>
  :root {
    --bg: #0a0c11;
    --card: #12151d;
    --card-hover: #151a25;
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.13);
    --text: #e7eaf1;
    --text-dim: #98a1b3;
    --text-faint: #7a8499;
    --accent: #6366f1;
    --accent-soft: #818cf8;
    --accent-tint: rgba(99, 102, 241, 0.1);
    --gold: #e3b96a;
    --silver: #a8b0c0;
    --bronze: #c08a5e;
    --danger-bg: rgba(248, 113, 113, 0.07);
    --danger-border: rgba(248, 113, 113, 0.22);
    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.12);
    --radius: 12px;
    --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.32);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  html { color-scheme: dark; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(1100px 500px at 50% -14%, rgba(99, 102, 241, 0.07), transparent 62%),
      var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .brand { display: flex; align-items: center; gap: 13px; }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28);
    flex: none;
  }

  .brand-mark svg { width: 21px; height: 21px; }

  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.025em; }

  .updated {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .updated::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px var(--success-glow);
    flex: none;
  }

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: #fca5a5;
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 18px;
  }

  .banner svg { width: 16px; height: 16px; flex: none; }

  .cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-md);
    min-width: 0;
    transition: border-color 0.18s ease, box-shadow 0.18s ease,
      background 0.18s ease;
  }

  @media (hover: hover) {
    .card:hover {
      border-color: var(--border-strong);
      background: var(--card-hover);
      box-shadow: var(--shadow-lg);
    }
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .card-title { display: flex; align-items: center; gap: 9px; }

  .card-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--accent-soft);
    background: var(--accent-tint);
    border: 1px solid rgba(99, 102, 241, 0.18);
    flex: none;
  }

  .card-icon svg { width: 15px; height: 15px; }

  .card h2 { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }

  .tabs {
    display: inline-flex;
    gap: 2px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
  }

  .tab {
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab:hover { color: var(--text); }

  .tab.is-active {
    background: rgba(255, 255, 255, 0.09);
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .tbl table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .tbl thead th {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-faint);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.06em;
  }

  .tbl thead th.c-count { width: 46%; text-align: right; }

  .tbl tbody td {
    padding: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.045);
    font-size: 13px;
    vertical-align: middle;
  }

  .tbl tbody tr:last-child td { border-bottom: 0; }

  .tbl tbody tr { transition: background 0.12s ease; }

  .tbl tbody tr:hover { background: rgba(255, 255, 255, 0.025); }

  .c-rank { width: 52px; }

  .rank {
    display: inline-grid;
    place-items: center;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }

  .rank.r1 {
    color: var(--gold);
    background: rgba(227, 185, 106, 0.1);
    border-color: rgba(227, 185, 106, 0.3);
  }

  .rank.r2 {
    color: var(--silver);
    background: rgba(168, 176, 192, 0.1);
    border-color: rgba(168, 176, 192, 0.3);
  }

  .rank.r3 {
    color: var(--bronze);
    background: rgba(192, 138, 94, 0.1);
    border-color: rgba(192, 138, 94, 0.3);
  }

  .c-nick {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }

  .c-count { text-align: right; }

  .c-count .bar {
    display: inline-block;
    vertical-align: middle;
    width: calc(100% - 44px);
    max-width: 120px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }

  .c-count .bar-fill {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    transition: width 0.4s ease;
  }

  .c-count .num {
    display: inline-block;
    width: 36px;
    text-align: right;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .tbl-empty {
    padding: 26px 10px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  @media (max-width: 760px) {
    body { padding: 16px 12px 32px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .cards { grid-template-columns: 1fr; }
    .card-head { flex-direction: column; align-items: flex-start; }
    .tabs { width: 100%; }
    .tab { flex: 1; text-align: center; }
    .tbl thead th.c-count { width: 40%; }
    h1 { font-size: 18px; }
  }

  @media (max-width: 400px) {
    body { padding: 14px 10px 28px; }
    .card { padding: 14px; }
    .tab { padding: 5px 8px; font-size: 11.5px; }
    .c-count .bar { max-width: 88px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"

<button class="tab is-active" type="button" role="tab" aria-selected="true" data-period="daily">일간</button>

<div class="tbl" id="tbl-comments-weekly" data-metric="comments" data-period="weekly" hidden><table><thead><tr><th class="c-rank">순위</th><th>닉네임</th><th class="c-count">개수</th></tr></thead><tbody></tbody></table><div class="tbl-empty" hidden></div></div>

<button class="tab is-active" type="button" role="tab" aria-selected="true" data-period="daily">일간</button>

  </div>
<div class="tbl" id="tbl-given-daily" data-metric="given" data-period="daily"><table><thead><tr><th class="c-rank">순위</th><th>닉네임</th><th class="c-count">개수</th></tr></thead><tbody></tbody></table><div class="tbl-empty" hidden></div></div>

      <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></span>
      <h2>추천받은 수</h2>
    </div>
    <div class="tabs" role="tablist" aria-label="기간 선택">
<button class="tab is-active" type="button" role="tab" aria-selected="true" data-period="daily">일간</button>
<button class="tab" type="button" role="tab" aria-selected="false" data-period="weekly">주간</button>

<script>
(function () {
  'use strict';

  var RANKINGS_URL = 'https://owenoffbeat.github.io/ygosu-mstz/rankings.json?v=' + Date.now();
  var RETRY_MS = 30 * 1000;      // fetch 실패 시 재시도 간격
  var REFRESH_MS = 5 * 60 * 1000; // 성공 시 자동 재조회 간격 (새로고침 없이 최신 데이터)
  var METRICS = ['posts', 'comments', 'given', 'recv'];
  var PERIODS = ['daily', 'weekly', 'monthly'];
  var timer = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtKST(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var parts = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hourCycle: 'h23'
    }).formatToParts(d);
    var get = function (t) {
      var hit = parts.filter(function (p) { return p.type === t; })[0];
      return hit ? hit.value : '';
    };
    return get('year') + '-' + get('month') + '-' + get('day') + ' ' +
      get('hour') + ':' + get('minute') + ':' + get('second');
  }

  var bannerEl = document.getElementById('banner');
  var bannerText = document.getElementById('banner-text');
  var updatedEl = document.getElementById('updated');

  function showBanner(msg) {
    bannerText.textContent = msg;
    bannerEl.hidden = false;
  }

  function hideBanner() {
    bannerEl.hidden = true;
  }

  function render(data) {
    if (!data || typeof data !== 'object') return;
    updatedEl.textContent = '마지막 갱신: ' + fmtKST(data.generatedAt);

    var givenUnavailable = !!(data.top && data.top.given && data.top.given.unavailable);

    METRICS.forEach(function (m) {
      PERIODS.forEach(function (p) {
        var box = document.getElementById('tbl-' + m + '-' + p);
        if (!box) return;
        var tbody = box.querySelector('tbody');
        var empty = box.querySelector('.tbl-empty');

        if (m === 'given' && givenUnavailable) {
          tbody.innerHTML = '';
          empty.textContent = '추천한 수 지표는 제공되지 않습니다';
          empty.hidden = false;
          return;
        }

        var rows = data.top && data.top[m] && data.top[m][p];
        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '';
          empty.textContent = '아직 데이터가 없습니다';
          empty.hidden = false;
          return;
        }

        empty.hidden = true;
        var max = 1;
        rows.forEach(function (r) {
          var c = Number(r.count) || 0;
          if (c > max) max = c;
        });

        tbody.innerHTML = rows.map(function (r) {
          var rank = Number(r.rank) || 0;
          var count = Number(r.count) || 0;
          var pct = Math.max(2, Math.round((count / max) * 100));
          var medal = rank >= 1 && rank <= 3 ? ' r' + rank : '';
          return '<tr>' +
            '<td class="c-rank"><span class="rank' + medal + '">' + rank + '</span></td>' +
            '<td class="c-nick" title="' + esc(r.nick) + '">' + esc(r.nick) + '</td>' +
            '<td class="c-count"><span class="bar"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
            '<span class="num">' + count + '</span></td>' +
            '</tr>';
        }).join('');
      });
    });
  }

  function schedule(delay) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(load, delay);
  }

  function load() {
    fetch(RANKINGS_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        hideBanner();
        render(data);
        schedule(REFRESH_MS); // 성공 시 5분 뒤 자동 재조회
      })
      .catch(function () {
        showBanner('랭킹 데이터를 불러오지 못했습니다 — 30초 후 자동으로 다시 시도합니다');
        schedule(RETRY_MS); // 실패 시 30초 뒤 자동 재시도
      });
  }

  // 기간 탭 전환 (클릭 + 키보드 내비게이션)
  function activateTab(tab, tabs, tables) {
    var period = tab.getAttribute('data-period');
    tabs.forEach(function (t) {
      var on = t === tab;
      t.classList.toggle('is-active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.setAttribute('tabindex', on ? '0' : '-1');
    });
    tables.forEach(function (tbl) {
      tbl.hidden = tbl.getAttribute('data-period') !== period;
    });
  }

  Array.prototype.slice.call(document.querySelectorAll('.card')).forEach(function (card) {
    var tabs = card.querySelectorAll('.tab');
    var tables = card.querySelectorAll('.tbl');
    var tablist = card.querySelector('.tabs');
    tabs.forEach(function (tab) {
      tab.setAttribute('tabindex', tab.classList.contains('is-active') ? '0' : '-1');
      tab.addEventListener('click', function () {
        activateTab(tab, tabs, tables);
      });
    });
    tablist.addEventListener('keydown', function (e) {
      var idx = Array.prototype.indexOf.call(tabs, document.activeElement);
      if (idx === -1) return;
      var next;
      if (e.key === 'ArrowRight') {
        next = tabs[(idx + 1) % tabs.length];
      } else if (e.key === 'ArrowLeft') {
        next = tabs[(idx - 1 + tabs.length) % tabs.length];
      } else if (e.key === 'Home') {
        next = tabs[0];
      } else if (e.key === 'End') {
        next = tabs[tabs.length - 1];
      } else {
        return;
      }
      e.preventDefault();
      activateTab(next, tabs, tables);
      next.focus();
    });
  });

  load();
})();
</script>
</body>
</html>
